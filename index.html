<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ee5351">
    <title>Pokédex — Explore Pokémon</title>
    <link rel="icon" href="assets/pokeball.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dialog.css">
    <script src="templates.js" defer></script>
    <script src="api.js" defer></script>
    <script src="script.js" defer></script>
    <script src="dialog.js" defer></script>
</head>
<body onload="init()">
    <header class="site-header">
        <div class="header-content">
            <a class="brand" href="index.html" aria-label="Pokédex home">
                <img src="assets/pokeball.svg" alt="" width="42" height="42">
                <span>Pokédex<span class="brand-dot">.</span></span>
            </a>
            <form id="search-form" class="search-form" role="search">
                <label class="sr-only" for="search-input">Search Pokémon by name</label>
                <input id="search-input" data-id="search-input" type="search" placeholder="Search Pokémon…" autocomplete="off" aria-describedby="search-hint">
                <button id="search-button" data-id="search-button" type="submit" aria-label="Search Pokémon" disabled>Search</button>
            </form>
            <p id="search-hint" class="search-hint">Enter at least 3 letters</p>
        </div>
    </header>
    <main class="page-content" data-id="content"><p id="status"></p></main>
</body>
</html>
